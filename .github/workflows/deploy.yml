name: Deploy

# Reusable production deploy for every damian1000 service. Callers reduce to a `uses:` one-liner
# passing only what genuinely differs: the service name, its distribution module, the public URL,
# and the port answering /readyz on the box.
#
# It exists because the five services carried five hand-maintained copies of this file, and they
# had already drifted apart in ways nobody chose: the readiness hold below was in two of them,
# `systemctl enable` in four. Copies of a deploy script diverge silently, and the divergence is
# only discovered during an incident.
#
# The deploy pipeline re-runs the full gate before packaging. CD owns its own go/no-go rather than
# trusting a separate workflow, and ships the bytes it just tested.
#
# That gate is `clean build`, matching ci.yml, and the difference is not cosmetic: `check` does not
# depend on `jar`, so every packaging task sits outside it. stocks-analysis-us shipped a fat-jar
# task that had never once succeeded while its badge stayed green on `clean check`. This workflow
# ran `clean check` and called itself the full gate until 2026-08-07 — the 2026-08-02 change
# reached ci.yml and the handbook but not the path that actually reaches production.
#
# Release, health check and rollback are one remote script so the decision to roll back is made on
# the box: a runner that dies between "restart" and "check" cannot leave a broken release serving
# with nothing left to react to it.
#
# That script is no longer sent from here. It lives on the box as /usr/local/bin/deploy-service,
# owned by root and versioned with the box's other privileged configuration, and this workflow asks
# for a release in five words with the bundle on stdin. The difference is what a stolen
# DEPLOY_SSH_KEY is worth: piping a script into `ssh ... bash -s` needs a key that can run anything
# as a user with passwordless sudo, and on box 2 the key can now only run that one script, under an
# account whose only root right is restarting one named service.
on:
  workflow_call:
    inputs:
      app:
        description: >-
          Service name. Names the systemd unit, the install directory on the box, and
          deploy/<app>.service in the calling repository.
        type: string
        required: true
      dist-module:
        description: >-
          Gradle module producing the distribution. Empty for a single-module root project. One
          input rather than separate task and directory inputs, which could be set inconsistently.
        type: string
        default: ""
      url:
        description: Public URL recorded on the production environment.
        type: string
        required: true
      health-port:
        description: Local port answering /readyz on the box.
        type: string
        required: true
      hold-seconds:
        description: >-
          Seconds readiness must still hold after it first appears. A single sample can pass in
          the window before a service's first real self-check has run, so the gate re-probes
          rather than trusting the first 200.
        type: number
        default: 15
      startup-seconds:
        description: >-
          How long a release may take to answer /readyz before it is treated as failed. The
          default was an unnamed 30 and that was too tight: visitor-analytics opens an Oracle
          wallet and runs Flyway against a remote Autonomous Database before it binds, which
          takes 31 to 33 seconds, so a deploy on 2026-08-07 was rolled back one second before the
          new release would have answered. Marginal budgets fail intermittently, which is the
          worst way for a deploy gate to be wrong.
        type: number
        default: 90
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DEPLOY_HOST:
        required: true
      DEPLOY_USER:
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Node # Prettier (web + config formatting) runs under Spotless
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Build, test, and package the distribution
        env:
          APP: ${{ inputs.app }}
          MODULE: ${{ inputs.dist-module }}
        run: |
          set -euo pipefail
          if [ -n "$MODULE" ]; then
            ./gradlew --no-daemon clean build ":$MODULE:installDist"
            install_root="$MODULE/build/install"
          else
            ./gradlew --no-daemon clean build installDist
            install_root="build/install"
          fi
          # One bundle carrying the distribution and the repository's deploy directory, because the
          # restricted key has no scp: everything the box needs arrives on the deploy's stdin or
          # not at all. Fixed names inside it, so the box never has to guess what it received.
          mkdir -p bundle
          cp -r "$install_root/$APP" bundle/dist
          if [ -d deploy ]; then cp -r deploy bundle/deploy; fi
          tar -czf "$APP-dist.tar.gz" -C bundle .

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.app }}-dist
          path: ${{ inputs.app }}-dist.tar.gz
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # for deploy/known_hosts.pub, which is needed before the connection rather than on the far
        # side of it. Everything else the box needs travels inside the bundle.

      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.app }}-dist

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key rather than ssh-keyscan: trust-on-first-use accepts whatever answers
          # on the address, so anything that could take over it would be handed the deploy key
          # and the artifact. deploy/known_hosts.pub holds the key without the host field — an
          # SSH host key is public by design, while the address stays in the secret.
          awk -v host="$DEPLOY_HOST" '{ print host, $0 }' deploy/known_hosts.pub > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Release, verify, and roll back on failure
        env:
          APP: ${{ inputs.app }}
          HEALTH_PORT: ${{ inputs.health-port }}
          HOLD_SECONDS: ${{ inputs.hold-seconds }}
          STARTUP_SECONDS: ${{ inputs.startup-seconds }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # The whole deploy is one request: five words the box validates, and the bundle on stdin.
          # Where the key is restricted the words arrive as SSH_ORIGINAL_COMMAND and the verb is
          # ignored; where it is not, they are argv. The exit code is the box's verdict on the
          # release, including whether a rollback was needed and whether it came back up.
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy-service $APP $GITHUB_SHA $HEALTH_PORT $HOLD_SECONDS $STARTUP_SECONDS" \
            < "$APP-dist.tar.gz"
