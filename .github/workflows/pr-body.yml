name: PR body

# This repository's caller for the scan next to it. Kept separate from `lint.yml` rather than
# added as a step to it: the scan needs the `edited` trigger, and putting that on the lint
# workflow would re-run actionlint and Prettier every time someone fixed a typo in a title.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-body:
    uses: ./.github/workflows/pr-body-scan.yml
