name: PR body scan

# The attribution scan reads git history. Nothing read the pull request body, and the body is
# where an attribution footer arrives without anyone writing one: Claude Code's backend appends
# `Generated by Claude Code`, carrying a session URL, at creation, whatever body the agent
# supplied. Document 08 requires an agent to read the body back and rewrite it. This is the
# gate behind that rule, and it exists because the rule is unenforceable by care alone — the
# text is written by a system the agent does not control.
#
# Three decisions are load-bearing:
#
# 1. It reads the body live over the API rather than from `github.event.pull_request.body`.
#    The event payload is frozen at the instant the event fired, so a footer stripped a second
#    after creation still fails a payload read — permanently, on a pull request that is already
#    correct. Reading live is what makes the `edited` re-run in point 2 able to clear it.
#
# 2. Callers trigger on `edited` as well as `opened`. Removing the footer is an edit, and an
#    edit raises no other event. `synchronize` is there for a different reason: a check run
#    attaches to a commit, so a push moves the head SHA and the check must report against it.
#
# 3. The pattern is line-anchored. The history scan's message check is anchored for the same
#    reason — prose legitimately mentions CLAUDE.md — and a pull request body is more prose,
#    not less. The body of the pull request that introduced this file quotes the footer text
#    inline; an unanchored match would have failed it.

on:
  workflow_call:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check pull request body for AI attribution
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        # `^[^a-z]*` lets the footer keep its own decoration — a leading underscore, an asterisk,
        # a robot emoji — while still requiring `Generated by/with Claude` to open the line. With
        # `-i`, the negated class excludes both cases, so it cannot skip over a word of prose to
        # reach a match further along.
        run: |
          set -euo pipefail
          body=$(gh pr view "$PR_URL" --json body --jq .body)
          if printf '%s' "$body" | grep -inE '^[^a-z]*generated[[:space:]]+(with|by)[[:space:]]+\[?claude|^co-authored-by:[[:space:]]*claude'; then
            echo "::error::AI attribution found in the pull request body — remove it, see document 08."
            exit 1
          fi
