name: Dependency check

# Reusable OWASP dependency-check for every buildable damian1000 repo. Scheduled rather than
# run per pull request: the scan is only as current as the NVD feed it downloads, so it finds
# advisories published since the last build, not defects in the diff — dependency-review already
# gates pull requests on advisories in what the diff adds. A weekly run is what catches a CVE
# published against a dependency nobody touched.
on:
  workflow_call:
    inputs:
      task:
        description: Gradle task to run — dependencyCheckAggregate at a multi-module root.
        type: string
        default: dependencyCheckAnalyze
      report-paths:
        description: Report path(s) uploaded as the run artifact.
        type: string
        # A pattern rather than a path because the two plugin versions in the estate disagree
        # about the directory: dependency-check-gradle 12.2.2 writes build/reports, and 13.0.0
        # writes build/reports/dependency-check. `**` matches zero directories as well as
        # several, so one default covers both while the platform bump propagates. A pattern that
        # stops matching now fails the run rather than uploading nothing quietly — that silence
        # is how build-conventions ran green for a scan whose report was never published.
        default: build/reports/**/dependency-check-report.html
    secrets:
      NVD_API_KEY:
        required: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Below the six-hour job ceiling, which GitHub reports as a cancelled run rather than a
    # failed one and therefore does not notify on. orderbook and risk-engine both hit it on
    # 2026-07-27 and reported nothing; a scan that has stopped running must say so.
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fail loudly rather than scanning without a key. Unauthenticated NVD callers get 5
      # requests per 30 seconds against 50 with a key, which turns an update into tens of
      # minutes and 403s — and a security scan that quietly degrades is worse than none.
      - name: Require an NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY is not set. Request a free key at https://nvd.nist.gov/developers/request-an-api-key and add it as a repository or organisation secret."
            exit 1
          fi

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The local NVD copy is the expensive part: downloading it cold takes hours. The key is
      # unique per run so every run writes a fresh entry, and the prefix restore-key starts
      # each run from the newest previous copy and updates it incrementally.
      - name: Restore the NVD data
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      # The previous scan's findings, so this one can report what changed rather than restate a
      # list nobody reads twice. Same unique-key-plus-prefix-restore shape as the NVD cache: each
      # run writes its own entry and starts from the newest earlier one.
      - name: Restore the previous scan's findings
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scan-findings.json
          key: depcheck-findings-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            depcheck-findings-${{ github.workflow }}-

      - name: Scan dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # dependencyCheckAggregate calls Task.project at execution time, which the
        # configuration cache forbids; the repositories enable it by default. A one-off
        # scheduled scan gains nothing from a reused configuration anyway.
        # --no-parallel as well: the aggregate task resolves other projects'
        # runtimeClasspath, which Gradle rejects without an exclusive lock when the
        # repository enables parallel execution.
        run: ./gradlew --no-daemon --no-configuration-cache --no-parallel ${{ inputs.task }}

      # Saved on failure as well. actions/cache skips its save step when the job fails, so a
      # repository that failed the CVSS gate discarded the feed it had just spent hours
      # downloading and started cold again the next week — a 4h34m run in
      # kafka-streams-patterns on 2026-07-27, against one minute for a repository that hit
      # its cache. The finding is what should fail the run, not the cost of the next one.
      - name: Save the NVD data
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}

      # The step that makes a scan readable. Everything above this line reported success while
      # publishing nothing at all for weeks: the plugin moved its output directory, the upload
      # ignored the miss, and nobody opens a run artifact anyway. A failing scan is already loud,
      # so this does not restate findings — it says what appeared and what went away since the
      # last run, in the job summary, where it is visible without downloading anything.
      #
      # Runs on failure too. Failing the CVSS gate is exactly when the delta is worth reading, and
      # that is the run where the Gradle step has already exited non-zero.
      - name: Summarise the findings
        if: always()
        env:
          # One file, read then rewritten: restored it holds the last run's findings, saved it
          # holds this run's, which is what the next run compares against.
          FINDINGS: scan-findings.json
        run: |
          python3 - <<'PY'
          import glob, json, os, pathlib

          reports = sorted(glob.glob("**/dependency-check-report.json", recursive=True))
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])

          # Assert rather than shrug. A missing report is the failure this whole step exists for:
          # it is indistinguishable from a clean scan in every other signal the run produces.
          if not reports:
              summary.write_text(
                  "## Dependency scan\n\n"
                  "**No JSON report was produced.** The scan cannot be read, so its result is "
                  "unknown rather than clean.\n"
              )
              raise SystemExit("no dependency-check JSON report found; the scan published nothing")

          findings, scanned = {}, 0
          for report in reports:
              data = json.loads(pathlib.Path(report).read_text())
              for dependency in data.get("dependencies", []):
                  scanned += 1
                  name = dependency.get("fileName", "unknown")
                  for vulnerability in dependency.get("vulnerabilities", []):
                      findings[f"{vulnerability.get('name', '?')} {name}"] = {
                          "cve": vulnerability.get("name", "?"),
                          "dependency": name,
                          "severity": (vulnerability.get("severity") or "UNKNOWN").upper(),
                      }

          findings_path = pathlib.Path(os.environ["FINDINGS"])
          previous = json.loads(findings_path.read_text()) if findings_path.exists() else None
          findings_path.write_text(json.dumps(sorted(findings)))

          appeared = sorted(set(findings) - set(previous)) if previous is not None else []
          resolved = sorted(set(previous) - set(findings)) if previous is not None else []

          rank = {"CRITICAL": 0, "HIGH": 1, "MEDIUM": 2, "LOW": 3, "UNKNOWN": 4}
          lines = ["## Dependency scan", ""]

          if previous is None:
              lines += ["No earlier scan cached, so there is no delta to report yet.", ""]
          elif not appeared and not resolved:
              lines += ["No change since the last scan.", ""]
          else:
              lines += [f"**{len(appeared)} new**, {len(resolved)} resolved since the last scan.", ""]

          if findings:
              lines += ["| | CVE | Severity | Dependency |", "| --- | --- | --- | --- |"]
              for key in sorted(findings, key=lambda k: (rank.get(findings[k]["severity"], 4), k)):
                  finding = findings[key]
                  mark = "new" if key in appeared else ""
                  lines.append(
                      f"| {mark} | {finding['cve']} | {finding['severity']} | {finding['dependency']} |"
                  )
              lines.append("")
          else:
              lines += [f"No vulnerable dependencies across {scanned} scanned.", ""]

          if resolved:
              lines += ["Resolved since the last scan:", ""]
              lines += [f"- {key}" for key in resolved]
              lines.append("")

          lines.append(f"Reports read: {', '.join(reports)}")
          summary.write_text("\n".join(lines) + "\n")
          PY

      # Saved whatever the gate did, so the next run's delta is measured against what this run
      # actually found rather than against the last run that happened to pass.
      - name: Save this scan's findings
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: scan-findings.json
          key: depcheck-findings-${{ github.workflow }}-${{ github.run_id }}

      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-check-report
          path: ${{ inputs.report-paths }}
          # `error`, not `ignore`. The pattern above is what broke silently before, and an upload
          # that shrugs at a miss is how a broken report path survived for weeks behind green runs.
          if-no-files-found: error
